name: Nonlinear stability development
on:
  push:
    branches: [experiment/real-pendulum-decay-2026-10-07]
    paths: ['experiments/bfg-stability-2026-10-07/**', '.github/workflows/bfg-stability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfg-stability
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r experiments/bfg-stability-2026-10-07/requirements.txt
      - working-directory: experiments/bfg-stability-2026-10-07
        run: sha256sum -c SHA256SUMS
      - working-directory: experiments/bfg-realization-development-2026-10-07
        run: python fetch_development.py
      - working-directory: experiments/bfg-force-selection-2026-10-07
        run: python -m unittest -v test_selection.py
      - working-directory: experiments/bfg-long-horizon-2026-10-07
        run: python -m unittest -v test_phase.py
      - working-directory: experiments/bfg-stability-2026-10-07
        run: python -m unittest -v test_stability.py
      - working-directory: experiments/bfg-stability-2026-10-07
        run: python stress.py ../bfg-realization-development-2026-10-07/data ../pendulum-mechanical-identification-2026-10-07/results/models.csv results
      - uses: actions/upload-artifact@v4
        with:
          name: bfg-stability-results
          path: experiments/bfg-stability-2026-10-07/results
