name: BFG spacetime and conservation controls
on:
  push:
    branches: [research/bfg-spacetime-conservation]
    paths:
      - 'research/spacetime-conservation/**'
      - 'experiments/real-eeg-covariance-2026-10-07/experiment.py'
      - '.github/workflows/bfg-spacetime-conservation.yml'
  pull_request:
    paths:
      - 'research/spacetime-conservation/**'
      - 'experiments/real-eeg-covariance-2026-10-07/experiment.py'
      - '.github/workflows/bfg-spacetime-conservation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfg-spacetime-conservation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finite-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/spacetime-conservation/requirements.txt
      - working-directory: papers/dynamic-order-2026-10-08
        run: sha256sum -c SHA256SUMS
      - run: python research/spacetime-conservation/audit.py
      - run: python research/spacetime-conservation/pair_audit.py
      - run: python research/spacetime-conservation/stable_pair_audit.py
      - run: python research/spacetime-conservation/component_exchange_audit.py
      - run: python research/spacetime-conservation/clock_audit.py
      - run: python research/spacetime-conservation/relational_frame_audit.py
      - run: python research/spacetime-conservation/eventual_class_audit.py
      - run: python research/spacetime-conservation/lex_selector_audit.py
      - run: python research/spacetime-conservation/mode_graph_audit.py
      - run: python research/spacetime-conservation/population_closure_audit.py
      - run: python research/spacetime-conservation/channel_range_audit.py
      - working-directory: research/spacetime-conservation
        run: python -m unittest -v test_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfg-spacetime-finite-controls
          path: |
            research/spacetime-conservation/results.json
            research/spacetime-conservation/pair_results.json
            research/spacetime-conservation/stable_pair_results.json
            research/spacetime-conservation/component_exchange_results.json
            research/spacetime-conservation/clock_results.json
            research/spacetime-conservation/relational_frame_results.json
            research/spacetime-conservation/eventual_class_results.json
            research/spacetime-conservation/lex_selector_results.json
            research/spacetime-conservation/mode_graph_results.json
            research/spacetime-conservation/population_closure_results.json
            research/spacetime-conservation/channel_range_results.json

