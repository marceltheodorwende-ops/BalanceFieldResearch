name: Shared BFG development calibration
on:
  push:
    branches: [experiment/real-pendulum-decay-2026-10-07]
    paths:
      - experiments/bfg-shared-calibration-2026-10-07/**
      - .github/workflows/bfg-shared-calibration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bfg-shared-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r experiments/bfg-shared-calibration-2026-10-07/requirements.txt
      - name: Development-only download
        working-directory: experiments/bfg-realization-development-2026-10-07
        run: python fetch_development.py
      - name: Verify and calibrate
        working-directory: experiments/bfg-shared-calibration-2026-10-07
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          PYTHONPATH=../pendulum-mechanical-identification-2026-10-07:../bfg-pendulum-motion-2026-10-07 python -m unittest -v test_shared.py
          python shared_calibration.py ../bfg-realization-development-2026-10-07/data ../pendulum-mechanical-identification-2026-10-07/results/models.csv results
      - uses: actions/upload-artifact@v4
        with:
          name: Shared-BFG-development-calibration
          path: experiments/bfg-shared-calibration-2026-10-07/results/
          retention-days: 30
