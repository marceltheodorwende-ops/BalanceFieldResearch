name: Real EEG covariance experiment
on:
  push:
    branches: ['experiment/real-eeg-covariance-2026-10-07']
    paths:
      - 'experiments/real-eeg-covariance-2026-10-07/experiment.py'
      - 'experiments/real-eeg-covariance-2026-10-07/test_experiment.py'
      - 'experiments/real-eeg-covariance-2026-10-07/report.py'
      - 'experiments/real-eeg-covariance-2026-10-07/requirements.txt'
      - '.github/workflows/real-eeg-covariance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-eeg-covariance
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/bfg-eeg-matplotlib
    defaults:
      run:
        shell: bash
        working-directory: experiments/real-eeg-covariance-2026-10-07
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            experiments/real-eeg-covariance-2026-10-07
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check independent numerical controls
        run: |
          mkdir -p results
          python -m unittest -v test_experiment 2>&1 | tee results/tests.log
          python -m pip freeze > results/environment.txt
      - name: Cache checksum-verified original measurements
        uses: actions/cache@v4
        with:
          path: experiments/real-eeg-covariance-2026-10-07/raw
          key: bfg-eegmmidb-1.0.0-checksummed-v1
      - name: Download original EEG measurements
        run: python experiment.py download
      - name: Evaluate frozen bridge on held-out subjects
        run: python experiment.py evaluate
      - name: Write report and integrity manifest
        run: python report.py
      - name: Preserve run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-eeg-covariance-results
          path: |
            experiments/real-eeg-covariance-2026-10-07/results/
            experiments/real-eeg-covariance-2026-10-07/README.md
            experiments/real-eeg-covariance-2026-10-07/SHA256SUMS.txt
      - name: Commit measured results to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results README.md SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Publish held-out real EEG covariance prediction results'
          git push origin HEAD:experiment/real-eeg-covariance-2026-10-07
