[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfg-emergence-studio"
version = "0.0.0"
description = "Domain-agnostic experimental software for Balance–Field Framework reclosure, emergence, and inverse design."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
bfg-studio = "bfg_studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bfg_studio*"]
